[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "three-set-milp"
version = "0.1.0"
description = "三子集比特可分性的 MILP 辅助论文复现"
readme = "README.md"
requires-python = ">=3.11"

[project.optional-dependencies]
milp = ["gurobipy>=10"]
test = ["pytest>=8"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-ra"
